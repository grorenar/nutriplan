name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Les 4 suites autonomes (moteur, interface, volume, synchronisation
  # automatique simulée) — aucune dépendance externe, aucun secret.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # Suite séparée : nécessite un PostgreSQL local (jamais la base Supabase
  # de production — tests/sync.test.mjs crée une base jetable et la
  # supprime/recrée à chaque exécution). Isolée dans son propre job pour ne
  # jamais bloquer les 4 suites ci-dessus si l'installation de PostgreSQL
  # échoue pour une raison propre au runner.
  test-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Installer et démarrer PostgreSQL (local, jetable)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
      # tests/sync.test.mjs exécute psql via `su postgres` (identique à la
      # procédure locale du README) : sans privilège root, `su` exigerait un
      # mot de passe que l'utilisateur postgres n'a pas sur ce runner — d'où
      # sudo ici (PATH explicitement conservé pour retrouver npm/node).
      - run: sudo env "PATH=$PATH" npm run test:sync
